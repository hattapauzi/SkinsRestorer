name: Forge 1.12.2

on:
  push:
    paths:
      - 'forge-1.12/**'
      - 'api/**'
      - 'shared/**'
      - 'build-data/**'
      - 'scissors/**'
      - 'gradle/libs.versions.toml'
  pull_request:
    paths:
      - 'forge-1.12/**'
      - 'api/**'
      - 'shared/**'
      - 'build-data/**'
      - 'scissors/**'
      - 'gradle/libs.versions.toml'

jobs:
  build:
    # Only run on PRs if the source branch is on someone else's repo
    if: "${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}"

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build parent unshaded jars
        run: ./gradlew :skinsrestorer-api:jar :skinsrestorer-build-data:jar :skinsrestorer-scissors:jar :skinsrestorer-shared:jar -x test
      - name: Test and release Forge 1.12.2 companion
        working-directory: forge-1.12
        run: ./gradlew test releaseJar
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: SkinsRestorer-Forge-1.12
          path: |
            forge-1.12/build/libs/SkinsRestorer-Forge-1.12-*.jar
            !forge-1.12/build/libs/*reobf*
            !forge-1.12/build/libs/*shaded-mcp*
            !forge-1.12/build/libs/*downgraded*
