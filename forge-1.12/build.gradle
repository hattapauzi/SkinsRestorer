import com.github.jengelman.gradle.plugins.shadow.transformers.PreserveFirstFoundResourceTransformer

plugins {
    id 'java-library'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.2'
    id 'com.gradleup.shadow' version '9.6.1'
    id 'xyz.wagyourtail.jvmdowngrader' version '2.0.1'
}

version = project.property('mod_version')
group = 'net.skinsrestorer'
base {
    archivesName = 'SkinsRestorer-Forge-1.12'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

minecraft {
    mcVersion = project.property('minecraft_version')
    mcpMappingChannel = project.property('mapping_channel')
    mcpMappingVersion = project.property('mapping_version')
    username = 'Dev'
    // RFG runServer/runObfServer use this launcher, not java.toolchain (which is 25 for compileJava/test).
    jvmLanguageVersion = JavaLanguageVersion.of(8)
    // Forge version is RFG's built-in 1.12.2 default (14.23.5.2847); getForgeVersion() is not settable.
    injectedTags.put('VERSION', project.version)
}

tasks.named('injectTags').configure {
    outputClassName.set('net.skinsrestorer.forge112.Tags')
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://jitpack.io/' }
    maven { url = 'https://libraries.minecraft.net' }
    maven { url = 'https://maven.wagyourtail.xyz/releases' }
}

configurations {
    shade
    compileOnly.extendsFrom shade
}

def unshaded = { String projectDir, String artifact ->
    def jarFile = file("../${projectDir}/build/libs/${artifact}-${project.property('mod_version')}.jar")
    files({
        if (!jarFile.isFile()) {
            throw new GradleException(
                    "Missing parent jar ${jarFile.canonicalPath}. Run from the repo root: ./gradlew :skinsrestorer-api:jar :skinsrestorer-build-data:jar :skinsrestorer-scissors:jar :skinsrestorer-shared:jar -x test")
        }
        jarFile
    })
}

dependencies {
    // Unshaded parent artifacts only (default `jar` task). Do not use *-all.jar or platform shadow jars.
    def parentJars = unshaded('api', 'skinsrestorer-api') +
            unshaded('build-data', 'skinsrestorer-build-data') +
            unshaded('scissors', 'skinsrestorer-scissors') +
            unshaded('shared', 'skinsrestorer-shared')
    shade parentJars
    testImplementation parentJars

    // Same coordinates as shared/build.gradle.kts + gradle/libs.versions.toml. File deps have no transitives.
    shade libs.gson
    shade libs.configme
    shade libs.injector
    shade libs.cloud.annotations
    annotationProcessor libs.cloud.annotations
    shade libs.cloud.processors.requirements
    shade libs.cloud.processors.cooldown
    shade libs.cloud.brigadier
    shade libs.cloud.translations.core
    shade libs.cloud.minecraft.extras
    shade libs.cloud.translations.minecraft.extras
    shade libs.reflect
    shade libs.mariadb.java.client
    shade libs.postgresql
    shade libs.hikari.cp
    shade libs.bstats.base
    libs.bundles.adventure.shared.get().forEach {
        shade it
    }

    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'
    shade 'javax.inject:javax.inject:1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.mojang:authlib:1.5.25'
}

shadowJar {
    configurations = [project.configurations.shade]
    archiveClassifier.set('shaded-mcp')
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    mergeServiceFiles()
    filesNotMatching('META-INF/services/**') {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
    transform(PreserveFirstFoundResourceTransformer)
    relocate 'com.google.gson', 'net.skinsrestorer.shadow.gson'
    relocate 'com.google.errorprone', 'net.skinsrestorer.shadow.errorprone'
    relocate 'org.bstats', 'net.skinsrestorer.shadow.bstats'
    relocate 'org.mariadb.jdbc', 'net.skinsrestorer.shadow.mariadb'
    relocate 'org.postgresql', 'net.skinsrestorer.shadow.postgresql'
    relocate 'com.zaxxer.hikari', 'net.skinsrestorer.shadow.hikari'
    relocate 'org.yaml.snakeyaml', 'net.skinsrestorer.shadow.snakeyaml'
    relocate 'ch.jalu.configme', 'net.skinsrestorer.shadow.configme'
    relocate 'javax.inject', 'net.skinsrestorer.shadow.javax.inject'
    relocate 'javax.annotation', 'net.skinsrestorer.shadow.javax.annotation'
    relocate 'ch.jalu.injector', 'net.skinsrestorer.shadow.injector'
    relocate 'org.incendo.cloud', 'net.skinsrestorer.shadow.cloud'
    relocate 'io.leangen.geantyref', 'net.skinsrestorer.shadow.geantyref'
    relocate 'net.lenni0451.reflect', 'net.skinsrestorer.shadow.reflect'
    relocate 'net.kyori', 'net.skinsrestorer.shadow.kyori'
}

// Task chain: shadowJar (Java 25, MCP) → reobfJar (Java 25, SRG) → downgradeMod → releaseJar (Java 8, SRG).
// RFG's prepareObfModsFolder copies reobfJar into run/obfuscated/mods/; we swap that for releaseJar
// so runObfServer loads the Java-8-downgraded artifact (Java 25 bytecode would fail on the Java 8 runtime).
tasks.named('reobfJar').configure {
    dependsOn shadowJar
    inputJar.set(shadowJar.archiveFile)
    archiveClassifier.set('reobf')
}

tasks.register('downgradeMod', xyz.wagyourtail.jvmdg.gradle.task.DowngradeJar) {
    dependsOn reobfJar
    inputFile = reobfJar.archiveFile
    downgradeTo = JavaVersion.VERSION_1_8
    archiveClassifier.set('downgraded')
}

tasks.register('releaseJar', xyz.wagyourtail.jvmdg.gradle.task.ShadeJar) {
    inputFile = tasks.named('downgradeMod', xyz.wagyourtail.jvmdg.gradle.task.DowngradeJar).flatMap { it.archiveFile }
    downgradeTo = JavaVersion.VERSION_1_8
    archiveClassifier.set('')
    destinationDirectory = layout.buildDirectory.dir('libs')
    shadePath = 'net/skinsrestorer/shadow/jvmdowngrader'
}

tasks.named('prepareObfModsFolder', Copy).configure { Copy t ->
    t.dependsOn releaseJar
    t.from(tasks.named('releaseJar').flatMap { it.archiveFile })
    def reobfJarFile = tasks.named('reobfJar').flatMap { it.archiveFile }
    t.exclude { FileTreeElement el ->
        !el.directory && el.file.canonicalFile == reobfJarFile.get().asFile.canonicalFile
    }
}

tasks.named('assemble').configure {
    dependsOn releaseJar
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'modid', project.property('mod_id')
    inputs.property 'name', project.property('mod_name')
    filesMatching('mcmod.info') {
        expand version: project.version,
                modid: project.property('mod_id'),
                name: project.property('mod_name')
    }
}
